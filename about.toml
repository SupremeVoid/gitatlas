# Configuration for `cargo about` — generates THIRD-PARTY-LICENSES.md.
#   cargo install cargo-about
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.md
#
# `accepted` is the set of SPDX license IDs allowed in the dependency tree. If a
# dependency introduces a license not listed here, `cargo about` fails loudly so
# the choice is reviewed rather than shipped silently.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # webpki-roots ships Mozilla's CA root list under the Community Data License
    # Agreement – Permissive (a permissive license for the certificate data).
    "CDLA-Permissive-2.0",
]

# Only the crates actually compiled into the release binary matter for
# distribution, so ignore dev-dependencies (test/bench-only tooling).
ignore-dev-dependencies = true
